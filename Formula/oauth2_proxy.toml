# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["go"]

[package]
name = "oauth2_proxy"
version = "7.15.6"
description = "Reverse proxy for authenticating users via OAuth 2 providers"
homepage = "https://oauth2-proxy.github.io/oauth2-proxy/"

[source]
url = "https://github.com/oauth2-proxy/oauth2-proxy/archive/refs/tags/v7.15.6.tar.gz"
sha256 = "7a24bf731e10d5db9149d7186576bc1286c5d084d3a9536ebece2e53b341b8a9"

[service]
run = "opt/oauth2_proxy/bin/oauth2-proxy --config=#{etc}/oauth2-proxy/oauth2-proxy.cfg"
keep_alive = true
working_dir = "HOMEBREW_PREFIX"

[build]
system = "autotools"
