# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["autoconf", "automake", "libtool", "gettext", "ffmpeg", "flac", "jpeg-turbo", "libexif", "libid3tag", "libogg", "libvorbis", "sqlite"]

[package]
name = "minidlna"
version = "1.3.3_3"
description = "Media server software, compliant with DLNA/UPnP-AV clients"
homepage = "https://sourceforge.net/projects/minidlna/"

[source]
url = "https://downloads.sourceforge.net/project/minidlna/minidlna/1.3.3/minidlna-1.3.3.tar.gz"
sha256 = "39026c6d4a139b9180192d1c37225aa3376fdf4f1a74d7debbdbb693d996afa4"

[service]
run = "minidlnad"
keep_alive = true
log_path = "var/log/minidlnad.log"
error_log_path = "var/log/minidlnad.log"

[build]
system = "autotools"
