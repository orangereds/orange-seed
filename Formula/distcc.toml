# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["autoconf", "automake", "pkgconf", "popt", "python-setuptools", "python@3.15"]

[package]
name = "distcc"
version = "3.4_3"
description = "Distributed compiler client and server"
homepage = "https://github.com/distcc/distcc/"

[source]
url = "https://github.com/distcc/distcc/releases/download/v3.4/distcc-3.4.tar.gz"
sha256 = "2b99edda9dad9dbf283933a02eace6de7423fe5650daa4a728c950e5cd37bd7d"

[service]
run = "opt/distcc/bin/distccd --allow=192.168.0.1/24"
keep_alive = true
working_dir = "opt_prefix"

[build]
system = "autotools"
