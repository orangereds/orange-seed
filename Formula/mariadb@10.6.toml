# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["bison", "cmake", "openjdk", "pkgconf", "groonga", "lz4", "lzo", "openssl@4", "pcre2", "xz", "zstd"]

[package]
name = "mariadb@10.6"
version = "0_1"
description = "Drop-in replacement for MySQL"
homepage = "https://mariadb.org/"

[source]
url = "https://archive.mariadb.org/mariadb-10.6.28/source/mariadb-10.6.28.tar.gz"
sha256 = "13d9330f3120c739757b215a3220a9c9e2ddf3c3c1b8beff5cd43942868f3d72"

[install]
keg_only = true

[service]
run = "opt/mariadb@10.6/bin/mysqld_safe --datadir=#{var}/mysql"
keep_alive = true
working_dir = "var"

[build]
system = "autotools"
