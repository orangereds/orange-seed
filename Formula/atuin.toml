dependencies = ["pkgconf", "protobuf", "rust"]

[package]
name = "atuin"
version = "0"
description = "Improved shell history for zsh, bash, fish and nushell"
homepage = "https://atuin.sh/"

[source]
url = "https://github.com/atuinsh/atuin/releases/download/v18.25.1/source.tar.gz"
sha256 = "ee4114ceada5d0acf000b306a1a1479ba6dd1f9fec69612f511a013ffa6fcd12"

[service]
run = "opt/atuin/bin/atuin daemon start"
keep_alive = true
log_path = "var/log/atuin.log"
error_log_path = "var/log/atuin.log"

[build]
system = "autotools"
