# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["rust"]

[package]
name = "kanata"
version = "1.12.0"
description = "Cross-platform software keyboard remapper for Linux, macOS and Windows"
homepage = "https://github.com/jtroo/kanata"

[source]
url = "https://github.com/jtroo/kanata/archive/refs/tags/v1.12.0.tar.gz"
sha256 = "7081073d1d22fe4e404cf8e7d1dfa3f72562fb2d96538367c07f64877dcbf87a"

[service]
run = "opt/kanata/bin/kanata --no-wait --cfg #{Dir.home}/.config/kanata/kanata.kbd"
keep_alive = true
working_dir = "Dir.home"
log_path = "var/log/kanata.log"
error_log_path = "var/log/kanata.log"

[build]
system = "autotools"
