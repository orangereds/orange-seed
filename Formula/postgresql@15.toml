# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["gettext", "pkgconf", "icu4c@79", "krb5", "lz4", "openssl@4", "readline", "zstd"]

[package]
name = "postgresql@15"
version = "0"
description = "Object-relational database system"
homepage = "https://www.postgresql.org/"

[source]
url = "https://ftp.postgresql.org/pub/source/v15.20/postgresql-15.20.tar.bz2"
sha256 = "30e65cbbb771a39b553ed2df7e65622e65647aed55dbc19bd0fe853ff0a08442"

[install]
keg_only = true

[service]
run = "opt/postgresql@15/bin/postgres -D f.postgresql_datadir"
keep_alive = true
working_dir = "HOMEBREW_PREFIX"
log_path = "f.postgresql_log_path"
error_log_path = "f.postgresql_log_path"

[service.env]
LC_ALL = "en_US.UTF-8"

[build]
system = "autotools"
