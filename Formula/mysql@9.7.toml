# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["bison", "cmake", "pkgconf", "abseil", "icu4c@79", "libfido2", "lz4", "openssl@4", "protobuf", "zlib-ng-compat", "zstd", "llvm"]

[package]
name = "mysql@9.7"
version = "12_1"
description = "Open source relational database management system"
homepage = "https://github.com/mysql/mysql-server"

[source]
url = "https://cdn.mysql.com/Downloads/MySQL-9.7/mysql-9.7.4.tar.gz"
sha256 = "9188eb1abec42b8ab8bb69948492f06258dd27e6aabd13e2d4c6197dbcde75b2"

[install]
keg_only = true

[service]
run = "opt/mysql@9.7/bin/mysqld_safe --datadir=#{var}/mysql"
keep_alive = true
working_dir = "var/mysql"

[build]
system = "cmake"
