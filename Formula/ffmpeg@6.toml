dependencies = ["pkgconf", "aom", "aribb24", "dav1d", "fontconfig", "freetype", "frei0r", "gnutls", "harfbuzz", "jpeg-xl", "lame", "libass", "libbluray", "librist", "libsoxr", "libssh", "libvidstab", "libvmaf", "libvorbis", "libvpx", "libx11", "libxcb", "opencore-amr", "openjpeg", "opus", "rav1e", "rubberband", "sdl2-compat", "snappy", "speex", "srt", "svt-av1", "tesseract", "theora", "webp", "x264", "x265", "xvid", "xz", "zeromq", "zimg", "libarchive", "libogg", "libsamplerate", "nasm"]

[package]
name = "ffmpeg@6"
version = "0_4"
description = "Play, record, convert, and stream audio and video"
homepage = "https://ffmpeg.org/"

[source]
url = "https://ffmpeg.org/releases/ffmpeg-6.1.6.tar.xz"
sha256 = "d4fcb164028dd3beee5d92c0ac72e46aac6973c75ea12dc14de07bf8f407370a"

[install]
