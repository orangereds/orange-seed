# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["certifi", "python@3.15"]

[package]
name = "vdirsyncer"
version = "0.21.0_2"
description = "Synchronize calendars and contacts"
homepage = "https://github.com/pimutils/vdirsyncer"

[source]
url = "https://files.pythonhosted.org/packages/79/05/b99b25ab9280fdd56b591ee58bd53b00da3e536c8e07fa714c95276b15a3/vdirsyncer-0.21.0.tar.gz"
sha256 = "b6ac040b880da6758f65c17a369572f62e7323be8d21cd330c26fa134d1b1373"

[service]
run = "opt/vdirsyncer/bin/vdirsyncer -v ERROR sync"
working_dir = "HOMEBREW_PREFIX"
log_path = "var/log/vdirsyncer.log"
error_log_path = "var/log/vdirsyncer.log"

[build]
system = "autotools"
