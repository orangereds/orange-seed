# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["pkgconf", "hiredis", "libevent", "libpq", "openssl@4"]

[package]
name = "coturn"
version = "4.19.2"
description = "Free open source implementation of TURN and STUN Server"
homepage = "https://github.com/coturn/coturn"

[source]
url = "https://github.com/coturn/coturn/archive/refs/tags/4.19.2.tar.gz"
sha256 = "2c80e4dffd0eb410951ba469f5cf8bd9b4a0658afc72d816f5c519c0c988d75c"

[service]
run = "opt/coturn/bin/turnserver -c etc/turnserver.conf"
keep_alive = true
working_dir = "HOMEBREW_PREFIX"
log_path = "var/log/coturn.log"
error_log_path = "var/log/coturn.log"

[build]
system = "autotools"
