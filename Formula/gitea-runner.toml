# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["go"]

[package]
name = "gitea-runner"
version = "6.0.1"
description = "Official Actions runner for Gitea"
homepage = "https://gitea.com/gitea/runner"

[source]
url = "https://gitea.com/gitea/runner/archive/v6.0.1.tar.gz"
sha256 = "302baec8d250021ce518f477f59ca774ca2bd79a27f87143e468dea29ddf9630"

[service]
run = "opt/gitea-runner/bin/gitea-runner daemon --config etc/gitea-runner/config.yaml"
keep_alive = true
working_dir = "var/lib/gitea-runner"
log_path = "var/log/gitea-runner.log"
error_log_path = "var/log/gitea-runner.err"

[build]
system = "autotools"
