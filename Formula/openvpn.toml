dependencies = ["pkgconf", "lz4", "lzo", "openssl@4", "pkcs11-helper"]

[package]
name = "openvpn"
version = "2.7.9"
description = "SSL/TLS VPN implementing OSI layer 2 or 3 secure network extension"
homepage = "https://openvpn.net/community/"

[source]
url = "https://swupdate.openvpn.net/community/releases/openvpn-2.7.9.tar.gz"
sha256 = "c42a6ed892ddfe2d6e3317a5040f19bec5827564affb2fe3f2b3904a94daacb1"

[service]
run = "openvpn --config etc/openvpn/openvpn.conf"
keep_alive = true
working_dir = "etc/openvpn"

[build]
system = "autotools"
