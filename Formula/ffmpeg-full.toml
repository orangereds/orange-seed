dependencies = ["pkgconf", "aom", "aribb24", "dav1d", "fontconfig", "freetype", "frei0r", "ggml", "gnutls", "harfbuzz", "jpeg-xl", "lame", "libass", "libbluray", "libplacebo", "librist", "libsoxr", "libssh", "libvidstab", "libvmaf", "libvorbis", "libvpx", "libx11", "libxcb", "opencore-amr", "openjpeg", "opus", "qrencode", "rav1e", "rubberband", "sdl2-compat", "snappy", "speex", "srt", "svt-av1", "tesseract", "theora", "webp", "whisper.cpp", "x264", "x265", "xvid", "xz", "zeromq", "zimg", "libarchive", "libogg", "libsamplerate", "nasm"]

[package]
name = "ffmpeg-full"
version = "0_3"
description = "Play, record, convert, and stream many audio and video codecs"
homepage = "https://ffmpeg.org/"

[source]
url = "https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz"
sha256 = "8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e"

[install]
keg_only = true

[build]
system = "autotools"
