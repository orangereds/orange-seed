dependencies = ["node", "pnpm", "go"]

[package]
name = "gitea"
version = "0"
description = "Painless self-hosted all-in-one software development service"
homepage = "https://about.gitea.com/"

[source]
url = "https://dl.gitea.com/gitea/28.4.0/gitea-src-28.4.0.tar.gz"
sha256 = "321fb8217c86ac7f41f60214e455c695b9c5382a514c8b40dd7ca20908f22b3f"

[service]
run = "opt/gitea/bin/gitea web --work-path var/gitea"
keep_alive = true
log_path = "var/log/gitea.log"
error_log_path = "var/log/gitea.log"

[build]
system = "autotools"
