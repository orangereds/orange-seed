# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["go", "node"]

[package]
name = "forgejo"
version = "0"
description = "Self-hosted lightweight software forge"
homepage = "https://forgejo.org/"

[source]
url = "https://codeberg.org/forgejo/forgejo/releases/download/v17.0.2/forgejo-src-17.0.2.tar.gz"
sha256 = "5b08f6c24819aeb62b80f2f50f989cfcdfde0a8887f66438cbf32b556b1b6efb"

[service]
run = "opt/forgejo/bin/forgejo web --work-path var/forgejo"
keep_alive = true
log_path = "var/log/forgejo.log"
error_log_path = "var/log/forgejo.log"

[build]
system = "autotools"
