# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["autoconf", "automake", "libtool", "pkgconf", "libsamplerate", "aften"]

[package]
name = "jack"
version = "1.9.22_1"
description = "Audio Connection Kit"
homepage = "https://jackaudio.org/"

[source]
url = "https://github.com/jackaudio/jack2/archive/refs/tags/v1.9.22.tar.gz"
sha256 = "1e42b9fc4ad7db7befd414d45ab2f8a159c0b30fcd6eee452be662298766a849"

[service]
run = "opt/jack/bin/jackd -X coremidi -d coreaudio"
keep_alive = true
working_dir = "opt_prefix"

[service.env]
PATH = "/usr/bin:/bin:/usr/sbin:/sbin:#{HOMEBREW_PREFIX}/bin"

[build]
system = "autotools"
