# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["rust"]

[package]
name = "docuum"
version = "0.27.3"
description = "Perform least recently used (LRU) eviction of Docker images"
homepage = "https://github.com/stepchowfun/docuum"

[source]
url = "https://github.com/stepchowfun/docuum/archive/refs/tags/v0.27.3.tar.gz"
sha256 = "678b5f949e8b4b84d72fbc82a04c203d42ddf8ce10e8201131b8c2b964cb224e"

[service]
run = "opt/docuum/bin/docuum"
keep_alive = true
log_path = "var/log/docuum.log"
error_log_path = "var/log/docuum.log"

[service.env]
PATH = "#{std_service_path_env}:/usr/local/bin"

[build]
system = "autotools"
