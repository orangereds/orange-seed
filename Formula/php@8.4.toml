# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["httpd", "pkgconf", "apr", "apr-util", "argon2", "autoconf", "curl", "freetds", "gd", "gmp", "icu4c@79", "libpq", "libsodium", "libzip", "net-snmp", "oniguruma", "openldap", "openssl@4", "pcre2", "sqlite", "tidy-html5", "unixodbc", "gettext"]

[package]
name = "php@8.4"
version = "0"
description = "General-purpose scripting language"
homepage = "https://www.php.net/"

[source]
url = "https://www.php.net/distributions/php-8.4.28.tar.xz"
sha256 = "0c8ec360e5dd8154f270b2fd50cd44ecc824e6ee39c85f911312b80d4daecd72"

[install]
keg_only = true

[service]
run = "php-fpm --nodaemonize"
keep_alive = true
working_dir = "var"
error_log_path = "var/log/php-fpm.log"

[build]
system = "autotools"
