# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["bison", "cmake", "fmt", "pkgconf", "groonga", "lz4", "lzo", "openssl@4", "pcre2", "xz", "zstd", "openjdk"]

[package]
name = "mariadb"
version = "13.0.2_1"
description = "Drop-in replacement for MySQL"
homepage = "https://mariadb.org/"

[source]
url = "https://archive.mariadb.org/mariadb-13.0.2/source/mariadb-13.0.2.tar.gz"
sha256 = "8ee8d955530faedcea344535de85495afb5b98128bbf660e56893e93e21ee8f7"

[service]
run = "opt/mariadb/bin/mariadbd-safe --datadir=#{var}/mysql"
keep_alive = true
working_dir = "var"

[build]
system = "autotools"
