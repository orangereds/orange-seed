dependencies = ["autoconf", "automake", "libevent", "openssl@4"]

[package]
name = "memcached"
version = "1.6.45_1"
description = "High performance, distributed memory object caching system"
homepage = "https://memcached.org/"

[source]
url = "https://www.memcached.org/files/memcached-1.6.45.tar.gz"
sha256 = "d362c64e6d8d5287153501eabf7c85b4a761432fbf53f5d7b085d0bb1653c1dd"

[service]
run = "opt/memcached/bin/memcached -l localhost"
keep_alive = true
working_dir = "HOMEBREW_PREFIX"

[build]
system = "autotools"
