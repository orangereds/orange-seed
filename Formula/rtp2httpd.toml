# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["cmake"]

[package]
name = "rtp2httpd"
version = "3.17.2"
description = "Multicast RTP/RTSP-to-HTTP converter with web player and status dashboard"
homepage = "https://rtp2httpd.com"

[source]
url = "https://github.com/stackia/rtp2httpd/archive/refs/tags/v3.17.2.tar.gz"
sha256 = "ce866091321a0d69dff7e8f7dda5d68be94e901659ed7d2ff4896029c8200ee6"

[service]
run = "rtp2httpd"
keep_alive = true
log_path = "var/log/rtp2httpd.log"
error_log_path = "var/log/rtp2httpd.log"

[build]
system = "cmake"
