# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["docbook", "docbook-xsl", "gettext", "pkgconf", "icu4c@79", "krb5", "lz4", "openssl@4", "readline", "zstd"]

[package]
name = "postgresql@17"
version = "0"
description = "Object-relational database system"
homepage = "https://www.postgresql.org/"

[source]
url = "https://ftp.postgresql.org/pub/source/v17.12/postgresql-17.12.tar.bz2"
sha256 = "9cf136a703d8ee2f83465c43be4e9e8e7930c82b0bfba13be7e2537be769ac55"

[install]
keg_only = true

[service]
run = "opt/postgresql@17/bin/postgres -D f.postgresql_datadir"
keep_alive = true
working_dir = "HOMEBREW_PREFIX"
log_path = "f.postgresql_log_path"
error_log_path = "f.postgresql_log_path"

[service.env]
LC_ALL = "en_US.UTF-8"

[build]
system = "autotools"
