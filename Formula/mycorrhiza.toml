# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["go"]

[package]
name = "mycorrhiza"
version = "1.16.0"
description = "Lightweight wiki engine with hierarchy support"
homepage = "https://mycorrhiza.wiki"

[source]
url = "https://github.com/bouncepaw/mycorrhiza/archive/refs/tags/v1.16.0.tar.gz"
sha256 = "1724c0439a6d0174841cb777a13ab82b189c3e3a855f858cd24a62a8620a1e2f"

[service]
run = "opt/mycorrhiza/bin/mycorrhiza var/lib/mycorrhiza"
keep_alive = true
log_path = "var/log/mycorrhiza.log"
error_log_path = "var/log/mycorrhiza.log"

[build]
system = "make"
