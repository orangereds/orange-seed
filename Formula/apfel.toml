dependencies = []

[package]
name = "apfel"
version = "1.19.0"
description = "Apple Intelligence from the command-line, with OpenAi-compatible API server"
homepage = "https://apfel.franzai.com"

[source]
url = "https://github.com/Arthur-Ficial/apfel/archive/refs/tags/v1.19.0.tar.gz"
sha256 = "1cb6e90e5e0a1052a727e528ce292b24b0051b1b38665f31ccbdbf437593987b"

[service]
run = "opt/apfel/bin/apfel --serve"
keep_alive = true
working_dir = "var"
log_path = "var/log/apfel.log"
error_log_path = "var/log/apfel.log"

[build]
system = "autotools"
