dependencies = ["go", "node", "pnpm"]

[package]
name = "dagu"
version = "2.27.0"
description = "Lightweight and powerful workflow engine"
homepage = "https://dagu.sh"

[source]
url = "https://github.com/dagucloud/dagu/archive/refs/tags/v2.27.0.tar.gz"
sha256 = "4b9677f50307484d4d828b4b25dab5b7953d68dc25e4342e45d79d0021834be3"

[service]
run = "opt/dagu/bin/dagu start-all"
