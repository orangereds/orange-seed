dependencies = ["openjdk"]

[package]
name = "payara"
version = "0"
description = "Java EE application server forked from GlassFish"
homepage = "https://www.payara.fish"

[source]
url = "https://search.maven.org/remotecontent?filepath=fish/payara/distributions/payara/7.2026.11/payara-7.2026.11.zip"
sha256 = "c142dd3c72fcb93f8361f5486da761e0e5795ef029fbf7a1ce6e35b284b06b66"

[service]
run = "opt/payara/libexec/glassfish/bin/asadmin start-domain --verbose domain1"
keep_alive = true
working_dir = "opt/payara/libexec/glassfish"

[service.env]
GLASSFISH_HOME = "glassfish"

[build]
system = "autotools"
