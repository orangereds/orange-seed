# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["go"]

[package]
name = "sdns"
version = "1.9.1"
description = "Privacy important, fast, recursive dns resolver server with dnssec support"
homepage = "https://sdns.dev/"

[source]
url = "https://github.com/semihalev/sdns/archive/refs/tags/v1.9.1.tar.gz"
sha256 = "63ee0d598681965afd09b9010d1594840bc7bedf1c4386af73ac30a57eb018b5"

[service]
run = "opt/sdns/bin/sdns --config etc/sdns.conf"
keep_alive = true
working_dir = "opt_prefix"
log_path = "var/log/sdns.log"
error_log_path = "var/log/sdns.log"

[build]
system = "autotools"
