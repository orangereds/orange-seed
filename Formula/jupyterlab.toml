dependencies = ["cmake", "ninja", "certifi", "cffi", "libyaml", "node", "pandoc", "python@3.15", "rpds-py", "zeromq"]

[package]
name = "jupyterlab"
version = "4.6.6_1"
description = "Interactive environments for writing and running code"
homepage = "https://jupyter.org/"

[source]
url = "https://files.pythonhosted.org/packages/51/43/490a500e421a46900c8afb0c912c1bf3c9977c85831a3815e2c2139309a9/jupyterlab-4.6.6.tar.gz"
