# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["autoconf", "automake", "pkgconf", "openssl@4"]

[package]
name = "openfortivpn"
version = "1.24.1_1"
description = "Open Fortinet client for PPP+TLS VPN tunnel services"
homepage = "https://github.com/adrienverge/openfortivpn"

[source]
url = "https://github.com/adrienverge/openfortivpn/archive/refs/tags/v1.24.1.tar.gz"
sha256 = "c40d33acd97b89c2e943bfd839c19b69e5a7a5997052e2fc9a595602745c0465"

[service]
run = "opt/openfortivpn/bin/openfortivpn -c etc/openfortivpn/openfortivpn/config"
keep_alive = true
log_path = "var/log/openfortivpn.log"
error_log_path = "var/log/openfortivpn.log"

[build]
system = "autotools"
