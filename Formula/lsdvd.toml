# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["autoconf", "automake", "pkgconf", "libdvdcss", "libdvdread", "libxml2"]

[package]
name = "lsdvd"
version = "0"
description = "Read the content info of a DVD"
homepage = "https://sourceforge.net/projects/lsdvd/"

[source]
url = "https://git.code.sf.net/p/lsdvd/git.git"
# sha256 未找到，安装时将跳过完整性校验
sha256 = ""

[build]
system = "autotools"
