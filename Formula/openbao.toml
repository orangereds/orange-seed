# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["go", "node", "pnpm"]

[package]
name = "openbao"
version = "0"
description = "Provides a software solution to manage, store, and distribute sensitive data"
homepage = "https://openbao.org/"

[source]
url = "https://github.com/openbao/openbao.git"
# sha256 未找到，安装时将跳过完整性校验
sha256 = ""

[service]
run = "opt/openbao/bin/bao server -dev"
keep_alive = true
working_dir = "var"
log_path = "var/log/openbao.log"
error_log_path = "var/log/openbao.log"

[build]
system = "autotools"
