dependencies = ["cmake", "nlohmann-json", "snowball", "boost", "cctz", "croaring", "icu4c@79", "libpq", "mariadb-connector-c", "openssl@4", "re2", "unixodbc", "xxhash", "zstd"]

[package]
name = "manticoresearch"
version = "12f86b4299dcef1495972838b76931bf46e4426f"
