# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["openssl@4"]

[package]
name = "uftp"
version = "5.0.4"
description = "Secure, reliable, efficient multicast file transfer program"
homepage = "https://uftp-multicast.sourceforge.net/"

[source]
url = "https://downloads.sourceforge.net/project/uftp-multicast/source-tar/uftp-5.0.4.tar.gz"
sha256 = "50df3f0e59ebd59ed1b9bc8af991a0187df14d928188ff5f62c3d65adcd113ab"

[service]
run = "opt/uftp/bin/uftpd -d"
keep_alive = true
working_dir = "var"

[build]
system = "autotools"
