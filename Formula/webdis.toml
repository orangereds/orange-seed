# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["libevent"]

[package]
name = "webdis"
version = "0.1.25"
description = "Redis HTTP interface with JSON output"
homepage = "https://webd.is/"

[source]
url = "https://github.com/nicolasff/webdis/archive/refs/tags/0.1.25.tar.gz"
sha256 = "60dc5e876a1df74d83ce5db41f99c61e62f45fa5ea7dbfedde4b1c99530f8032"

[service]
run = "opt/webdis/bin/webdis etc/webdis.prod.json"
keep_alive = true
working_dir = "var"

[build]
system = "autotools"
