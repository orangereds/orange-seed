# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["docbook", "docbook-xsl", "gettext", "pkgconf", "icu4c@79", "krb5", "lz4", "openssl@4", "readline", "zstd"]

[package]
name = "postgresql@19"
version = "0"
description = "Object-relational database system"
homepage = "https://www.postgresql.org/"

[source]
url = "https://ftp.postgresql.org/pub/source/v19.0/postgresql-19.0.tar.bz2"
sha256 = "a89fd70efbad6a08c7dbed8d4872e3af30170d9e5ca9dc7906523be95b4e692d"

[install]
keg_only = true

[service]
run = "opt/postgresql@19/bin/postgres -D f.postgresql_datadir"
keep_alive = true
working_dir = "HOMEBREW_PREFIX"
log_path = "f.postgresql_log_path"
error_log_path = "f.postgresql_log_path"

[service.env]
LC_ALL = "en_US.UTF-8"

[build]
system = "autotools"
