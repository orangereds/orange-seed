dependencies = ["go", "icu4c@79"]

[package]
name = "dolt"
version = "2.7.6"
description = "Git for Data"
homepage = "https://www.dolthub.com"

[source]
url = "https://github.com/dolthub/dolt/archive/refs/tags/v2.7.6.tar.gz"
sha256 = "34916339bba65bab6ff57bc47182f1213bbf64ee507b59c8ef1040e22a5143b8"

[service]
run = "opt/dolt/bin/dolt sql-server --config etc/dolt/config.yaml"
