# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["pkgconf", "gnutls", "libestr", "libfastjson", "libyaml", "protobuf-c", "snappy"]

[package]
name = "rsyslog"
version = "8.2610.0"
description = "Enhanced, multi-threaded syslogd"
homepage = "https://www.rsyslog.com/"

[source]
url = "https://www.rsyslog.com/files/download/rsyslog/rsyslog-8.2610.0.tar.gz"
sha256 = "7bdf95e81ea6c0ee5d586342d57d2a6e395b089fb3c67318a0dc555816de404b"

[service]
run = "rsyslogd -n -f etc/rsyslog.conf -i var/run/rsyslogd.pid"
keep_alive = true
log_path = "var/log/rsyslogd.log"
error_log_path = "var/log/rsyslogd.log"

[build]
system = "autotools"
