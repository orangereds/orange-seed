# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["cmake", "gettext", "nlohmann-json", "pkgconf", "tomlplusplus", "abseil", "c-ares", "grpc", "openssl@4", "protobuf", "re2"]

[package]
name = "recc"
version = "0"
description = "Remote Execution Caching Compiler"
homepage = "https://buildgrid.gitlab.io/recc"

[source]
url = "https://gitlab.com/BuildGrid/buildbox/buildbox/-/archive/1.4.32/buildbox-1.4.32.tar.gz"
sha256 = "a8c4e55cbcd7344848df7dfa2c78257cd1391c317c1efb2f2d65144a4baa477c"

[service]
run = "opt/recc/bin/recc-server --local-server-instance recc-server #{var}/recc/casd"
keep_alive = true
working_dir = "var/recc"
log_path = "var/log/recc-server.log"
error_log_path = "var/log/recc-server-error.log"

[build]
system = "cmake"
