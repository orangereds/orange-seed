# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["go"]

[package]
name = "nebula"
version = "1.12.0"
description = "Scalable overlay networking tool for connecting computers anywhere"
homepage = "https://github.com/slackhq/nebula"

[source]
url = "https://github.com/slackhq/nebula/archive/refs/tags/v1.12.0.tar.gz"
sha256 = "f4d33fbe0a57d2914b8cc94b463d3f170990f92f34251aaef1ca80fb5cd952b0"

[service]
run = "opt/nebula/bin/nebula -config etc/nebula/"
keep_alive = true
log_path = "var/log/nebula.log"
error_log_path = "var/log/nebula.log"

[build]
system = "autotools"
