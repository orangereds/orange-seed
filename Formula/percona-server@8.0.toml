# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["bison", "cmake", "pkgconf", "abseil", "icu4c@79", "libevent", "libfido2", "lz4", "openldap", "openssl@3", "protobuf", "zlib-ng-compat", "zstd"]

[package]
name = "percona-server@8.0"
version = "0_2"
description = "Drop-in MySQL replacement"
homepage = "https://www.percona.com"

[source]
url = "https://downloads.percona.com/downloads/Percona-Server-8.0/Percona-Server-8.0.46-37/source/tarball/percona-server-8.0.46-37.tar.gz"
sha256 = "cedff3c191ff160dfc0ce1c574440165f3f2bfe7a621699170adf4d1dc556617"

[install]
keg_only = true

[service]
run = "opt/percona-server@8.0/bin/mysqld_safe --datadir=#{var}/mysql"
keep_alive = true
working_dir = "var/mysql"

[build]
system = "cmake"
