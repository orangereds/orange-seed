dependencies = ["go", "node"]

[package]
name = "frps"
version = "0.72.0"
description = "Server app of fast reverse proxy to expose a local server to the internet"
homepage = "https://github.com/fatedier/frp"

[source]
url = "https://github.com/fatedier/frp/archive/refs/tags/v0.72.0.tar.gz"
sha256 = "20e2249c2b17cb7624317b0a9a0baed06c80c547d27568d18a32c78e46d79230"

[service]
run = "opt/frps/bin/frps -c etc/frp/frps.toml"
keep_alive = true
log_path = "var/log/frps.log"
error_log_path = "var/log/frps.log"

[build]
system = "autotools"
