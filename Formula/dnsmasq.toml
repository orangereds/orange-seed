# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["pkgconf"]

[package]
name = "dnsmasq"
version = "2.93"
description = "Lightweight DNS forwarder and DHCP server"
homepage = "https://thekelleys.org.uk/dnsmasq/doc.html"

[source]
url = "https://thekelleys.org.uk/dnsmasq/dnsmasq-2.93.tar.gz"
sha256 = "cc967771abdafeb43d10db18932d6b59fd4bed2c69c22acf8cb96aff6920d55f"

[service]
run = "dnsmasq --keep-in-foreground -C etc/dnsmasq.conf -7 etc/dnsmasq.d,*.conf"
keep_alive = true

[build]
system = "autotools"
