# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["cmake", "pkgconf", "ffmpeg", "libarchive", "minizip", "qtbase", "sdl2-compat", "x264", "x265"]

[package]
name = "fceux"
version = "0"
description = "All-in-one NES/Famicom Emulator"
homepage = "https://fceux.com/"

[source]
url = "https://github.com/TASEmulators/fceux.git"
# sha256 未找到，安装时将跳过完整性校验
sha256 = ""

[build]
system = "cmake"
