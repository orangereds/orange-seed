# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["meson", "ninja", "pkgconf", "bash", "fakeroot", "gettext", "libarchive", "openssl@4", "coreutils"]

[package]
name = "makepkg"
version = "0_1"
description = "Compile and build packages suitable for installation with pacman"
homepage = "https://wiki.archlinux.org/title/Makepkg"

[source]
url = "https://gitlab.archlinux.org/pacman/pacman.git"
# sha256 未找到，安装时将跳过完整性校验
sha256 = ""

[build]
system = "autotools"
