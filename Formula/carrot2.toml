# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["gradle", "node@22", "yarn", "openjdk"]

[package]
name = "carrot2"
version = "0"
description = "Search results clustering engine"
homepage = "https://search.carrot2.org/"

[source]
url = "https://github.com/carrot2/carrot2.git"
# sha256 未找到，安装时将跳过完整性校验
sha256 = ""

[service]
run = "opt/carrot2/bin/carrot2"
working_dir = "opt_libexec"

[build]
system = "autotools"
