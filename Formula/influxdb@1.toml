# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["go", "pkgconf", "rust"]

[package]
name = "influxdb@1"
version = "1.13.2"
description = "Time series, events, and metrics database"
homepage = "https://influxdata.com/time-series-platform/influxdb/"

[source]
url = "https://github.com/influxdata/influxdb/archive/refs/tags/v1.13.2.tar.gz"
sha256 = "b14af6f3eeb2a81f1fef94f867348d399ee528230fbcc9b947303f3f500ee1f1"

[install]
keg_only = true

[service]
run = "opt/influxdb@1/bin/influxd -config etc/influxdb.conf"
keep_alive = true
working_dir = "var"
log_path = "var/log/influxdb.log"
error_log_path = "var/log/influxdb.log"

[build]
system = "autotools"
