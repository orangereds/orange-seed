# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["cmake", "emacs", "llvm", "openssl@4"]

[package]
name = "rtags"
version = "2.44"
description = "Source code cross-referencer like ctags with a clang frontend"
homepage = "https://github.com/Andersbakken/rtags"

[source]
url = "https://github.com/Andersbakken/rtags/releases/download/v2.44/rtags-2.44.tar.bz2"
sha256 = "3db5b36216e0b0a98fa7ad1e03a29b2ca7c9d895d85dbe3b2760fcdc2f962db3"

[service]
run = "opt/rtags/bin/rdm --verbose --inactivity-timeout=300"
keep_alive = true
log_path = "var/log/rtags.log"
error_log_path = "var/log/rtags.log"

[build]
system = "cmake"
