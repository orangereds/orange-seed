# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["go", "lima"]

[package]
name = "colima"
version = "0"
description = "Container runtimes on MacOS (and Linux) with minimal setup"
homepage = "https://colima.run"

[source]
url = "https://github.com/abiosoft/colima.git"
# sha256 未找到，安装时将跳过完整性校验
sha256 = ""

[service]
run = "opt/colima/bin/colima start -f"
keep_alive = true
working_dir = "Dir.home"
log_path = "var/log/colima.log"
error_log_path = "var/log/colima.log"

[build]
system = "autotools"
