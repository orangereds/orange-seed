# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["gettext", "pkgconf", "icu4c@79", "krb5", "lz4", "openssl@4", "readline", "zstd"]

[package]
name = "postgresql@16"
version = "0"
description = "Object-relational database system"
homepage = "https://www.postgresql.org/"

[source]
url = "https://ftp.postgresql.org/pub/source/v16.16/postgresql-16.16.tar.bz2"
sha256 = "9d5cd8633043b75740d5d59749c6b7365e6aeb53c47098b1a5e80bb18f87881a"

[install]
keg_only = true

[service]
run = "opt/postgresql@16/bin/postgres -D f.postgresql_datadir"
keep_alive = true
working_dir = "HOMEBREW_PREFIX"
log_path = "f.postgresql_log_path"
error_log_path = "f.postgresql_log_path"

[service.env]
LC_ALL = "en_US.UTF-8"

[build]
system = "autotools"
