# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["go"]

[package]
name = "nsq"
version = "1.3.0"
description = "Realtime distributed messaging platform"
homepage = "https://nsq.io/"

[source]
url = "https://github.com/nsqio/nsq/archive/refs/tags/v1.3.0.tar.gz"
sha256 = "c6289e295aaa40c8d9651de76e66bc9f23e7f5c40b1cc051ea5901965093e1f0"

[service]
run = "opt/nsq/bin/nsqd -data-path=#{var}/nsq"
keep_alive = true
working_dir = "var/nsq"
log_path = "var/log/nsqd.log"
error_log_path = "var/log/nsqd.error.log"

[build]
system = "make"
