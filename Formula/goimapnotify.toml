# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["go"]

[package]
name = "goimapnotify"
version = "2.6.0"
description = "Execute scripts on IMAP mailbox changes using IDLE"
homepage = "https://gitlab.com/shackra/goimapnotify"

[source]
url = "https://gitlab.com/shackra/goimapnotify/-/archive/2.6.0/goimapnotify-2.6.0.tar.bz2"
sha256 = "9d51636d8f546d3fd2c85284800d5491b0919eecdb110092431e7ca15b771516"

[service]
run = "opt/goimapnotify/bin/goimapnotify"
keep_alive = true
log_path = "var/log/goimapnotify.log"
error_log_path = "var/log/goimapnotify.log"

[build]
system = "autotools"
