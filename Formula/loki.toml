# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["go"]

[package]
name = "loki"
version = "3.7.10"
description = "Horizontally-scalable, highly-available log aggregation system"
homepage = "https://grafana.com/oss/loki"

[source]
url = "https://github.com/grafana/loki/archive/refs/tags/v3.7.10.tar.gz"
sha256 = "52e1a821de73d634a152e6737f7a4629dae830240015a2d6f244ccaaf3b13357"

[service]
run = "opt/loki/bin/loki -config.file=#{etc}/loki-local-config.yaml"
keep_alive = true
working_dir = "var"
log_path = "var/log/loki.log"
error_log_path = "var/log/loki.log"

[build]
system = "autotools"
