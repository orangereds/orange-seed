dependencies = ["elixir", "erlang", "node", "postgresql@18", "openssl@4"]

[package]
name = "teslamate"
version = "4.5.0"
description = "Self-hosted data logger for your Tesla"
homepage = "https://docs.teslamate.org"

[source]
url = "https://github.com/teslamate-org/teslamate/archive/refs/tags/v4.5.0.tar.gz"
sha256 = "1f928cfeb788f0451fca80fd53e7e57afce882e479392cec0dd034aa6f2ce610"

[service]
run = "opt/teslamate/bin/teslamate_brew_services"
keep_alive = true
working_dir = "var"
log_path = "var/log/teslamate.log"
error_log_path = "var/log/teslamate.log"

[build]
system = "autotools"
