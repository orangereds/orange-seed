dependencies = ["docutils", "graphviz", "pkgconf", "sphinx-doc", "openssl@4", "pcre2"]

[package]
name = "varnish"
version = "9.1.0"
description = "High-performance HTTP accelerator"
homepage = "https://www.varnish-cache.org/"

[source]
url = "https://github.com/varnish/varnish/releases/download/varnish-9.1.0/varnish-9.1.0.tar.gz"
sha256 = "fe615fa024c801d12928e7eea0e822ba93ab625a585841143c36ae02d5bcc37a"

[service]
run = "varnishd"
keep_alive = true
working_dir = "HOMEBREW_PREFIX"
log_path = "var/varnish/varnish.log"
error_log_path = "var/varnish/varnish.log"

[build]
system = "autotools"
