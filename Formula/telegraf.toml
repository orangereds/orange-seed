# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["go"]

[package]
name = "telegraf"
version = "1.40.3"
description = "Plugin-driven server agent for collecting & reporting metrics"
homepage = "https://www.influxdata.com/time-series-platform/telegraf/"

[source]
url = "https://github.com/influxdata/telegraf/archive/refs/tags/v1.40.3.tar.gz"
sha256 = "27bfeaf8c56cbcffc289065623ff7e3b0ff9e48c1d9c00e2278ed453900a0e66"

[service]
run = "opt/telegraf/bin/telegraf -config etc/telegraf.conf -config-directory etc/telegraf.d"
keep_alive = true
working_dir = "var"
log_path = "var/log/telegraf.log"
error_log_path = "var/log/telegraf.log"

[build]
system = "autotools"
