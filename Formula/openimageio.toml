dependencies = ["cmake", "nanobind", "pkgconf", "robin-map", "ffmpeg", "fmt", "freetype", "giflib", "imath", "jpeg-turbo", "jpeg-xl", "libheif", "libpng", "libraw", "libtiff", "opencolorio", "openexr", "pugixml", "python@3.15", "tbb", "webp", "zlib-ng-compat"]

[package]
name = "openimageio"
version = "8_1"
description = "Library for reading, processing and writing images"
