dependencies = ["autoconf", "automake", "cmake", "libtool", "meson", "nasm", "ninja", "pkgconf", "dav1d", "freetype", "fribidi", "harfbuzz", "jansson", "jpeg-turbo", "lame", "libass", "libbluray", "libdvdnav", "libdvdread", "libogg", "libvorbis", "libvpx", "opus", "speex", "svt-av1", "theora", "x264", "xz", "zimg", "libx11"]

[package]
name = "handbrake"
version = "0_1"
