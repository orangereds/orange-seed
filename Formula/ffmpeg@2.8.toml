dependencies = ["pkgconf", "texi2html", "yasm", "fontconfig", "freetype", "frei0r", "lame", "libass", "libogg", "libvo-aacenc", "libvorbis", "libvpx", "opencore-amr", "openssl@4", "opus", "rtmpdump", "sdl12-compat", "snappy", "speex", "theora", "x264", "x265", "xvid", "xz"]

[package]
name = "ffmpeg@2.8"
version = "0_9"
description = "Play, record, convert, and stream audio and video"
homepage = "https://ffmpeg.org/"

[source]
url = "https://ffmpeg.org/releases/ffmpeg-2.8.22.tar.xz"
sha256 = "1fbbf622806a112c5131d42b280a9e980f676ffe1c81a4e0f2ae4cb121241531"

[install]
