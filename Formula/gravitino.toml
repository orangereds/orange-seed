# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["gradle@8", "node", "openjdk@17"]

[package]
name = "gravitino"
version = "1.3.1-src"
description = "High-performance, geo-distributed, and federated metadata lake"
homepage = "https://gravitino.apache.org"

[source]
url = "https://github.com/apache/gravitino/releases/download/v1.3.1/gravitino-1.3.1-src.tar.gz"
sha256 = "d9f4abda3d8397cc38cc116c86c796fc634eb15c040dcafa286b3c02455331a2"

[service]
run = "opt/gravitino/bin/gravitino.sh --config etc/gravitino run"
keep_alive = true
log_path = "var/log/gravitino.log"
error_log_path = "var/log/gravitino.log"

[build]
system = "autotools"
