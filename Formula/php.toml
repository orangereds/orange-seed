# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["bison", "re2c", "httpd", "pkgconf", "apr", "apr-util", "argon2", "autoconf", "curl", "freetds", "gd", "gmp", "icu4c@79", "libpq", "libsodium", "libzip", "net-snmp", "oniguruma", "openldap", "openssl@4", "pcre2", "sqlite", "tidy-html5", "unixodbc", "gettext"]

[package]
name = "php"
version = "8.6.0"
description = "General-purpose scripting language"
homepage = "https://www.php.net/"

[source]
url = "https://www.php.net/distributions/php-8.6.0.tar.xz"
sha256 = "5f84beaa3d763aee1e4feed99bf54ec692c383b322e25626807b589238c3a087"

[service]
run = "php-fpm --nodaemonize"
keep_alive = true
working_dir = "var"
error_log_path = "var/log/php-fpm.log"

[build]
system = "autotools"
