dependencies = ["libev", "openjdk@17", "python@3.13"]

[package]
name = "cassandra"
version = "0"
description = "Eventually consistent, distributed key-value store"
homepage = "https://cassandra.apache.org"

[source]
url = "https://www.apache.org/dyn/closer.lua?path=cassandra/5.0.9/apache-cassandra-5.0.9-bin.tar.gz"
