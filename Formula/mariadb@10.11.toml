dependencies = ["bison", "cmake", "fmt", "openjdk", "pkgconf", "groonga", "lz4", "lzo", "openssl@4", "pcre2", "xz", "zstd"]

[package]
name = "mariadb@10.11"
version = "0"
description = "Drop-in replacement for MySQL"
homepage = "https://mariadb.org/"

[source]
url = "https://archive.mariadb.org/mariadb-10.11.20/source/mariadb-10.11.20.tar.gz"
sha256 = "ac5c003f725950a4cbf9829bd9b191b73f8ab0f2630d6dbc6292fc5244d3c7cb"

[install]
keg_only = true

[service]
run = "opt/mariadb@10.11/bin/mysqld_safe --datadir=#{var}/mysql"
keep_alive = true
working_dir = "var"

[build]
system = "autotools"
