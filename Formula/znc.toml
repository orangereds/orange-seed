dependencies = ["cmake", "gettext", "pkgconf", "boost", "cctz", "icu4c@79", "openssl@4", "python@3.15"]

[package]
name = "znc"
version = "1.10.3_2"
description = "Advanced IRC bouncer"
homepage = "https://wiki.znc.in/ZNC"

[source]
url = "https://znc.in/releases/znc-1.10.3.tar.gz"
sha256 = "68f3f6641b480c041010c5596e1234043e05c9137eda06233845017603095f5b"

[service]
run = "opt/znc/bin/znc --foreground"
