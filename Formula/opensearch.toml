# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["openjdk@25"]

[package]
name = "opensearch"
version = "0"
description = "Open source distributed and RESTful search engine"
homepage = "https://github.com/opensearch-project/OpenSearch"

[source]
url = "https://github.com/opensearch-project/OpenSearch.git"
# sha256 未找到，安装时将跳过完整性校验
sha256 = ""

[service]
run = "opt/opensearch/bin/opensearch"
working_dir = "var"
log_path = "var/log/opensearch.log"
error_log_path = "var/log/opensearch.log"

[build]
system = "autotools"
