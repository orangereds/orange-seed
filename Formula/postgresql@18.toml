# 由 `fb convert` 从 Homebrew formula 自动生成；URL、构建参数与依赖请复核。
dependencies = ["docbook", "docbook-xsl", "gettext", "pkgconf", "icu4c@79", "krb5", "lz4", "openssl@4", "readline", "zstd"]

[package]
name = "postgresql@18"
version = "0"
description = "Object-relational database system"
homepage = "https://www.postgresql.org/"

[source]
url = "https://ftp.postgresql.org/pub/source/v18.7/postgresql-18.7.tar.bz2"
sha256 = "441dfae4280cae3e0425e5f876f80559fb0731c140f1aae22b3e5a54d0411bfd"

[install]
keg_only = true

[service]
run = "opt/postgresql@18/bin/postgres -D f.postgresql_datadir"
keep_alive = true
working_dir = "HOMEBREW_PREFIX"
log_path = "f.postgresql_log_path"
error_log_path = "f.postgresql_log_path"

[service.env]
LC_ALL = "en_US.UTF-8"

[build]
system = "autotools"
